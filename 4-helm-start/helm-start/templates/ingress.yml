apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  labels:
    app.kubernetes.io/name: myingress
spec:
  rules:
  - host: {{ .Values.app.name }}.test
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.app.name }}-clusterip
            port: 
              number: 80
  - host: {{ .Values.app.name }}.test
    http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: {{ .Values.app.name }}-clusterip
            port:
              number: 80
