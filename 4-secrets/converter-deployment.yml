apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
spec:
  selector:
    matchLabels:
      app: converter
  template:
    metadata:
      labels:
        app: converter
    spec:
      containers:
        - name: converter
          image: antonlarichev/conv-service:1.0
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - containerPort: 80
          env:
            - name: AMQP_EXCHANGE
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: AMQP_EXCHANGE
            - name: AMQP_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: AMQP_HOSTNAME
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: AMQP_USER
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysecret
                  key: AMQP_PASSWORD
          volumes:
            - name: config-volume
              configMap:
                name: my-config-map
                valueFrom:
                  key: VITE_DOMAIN

